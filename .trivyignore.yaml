# Remove these exceptions when Paketo ships patched launcher and Java 26-compatible helpers.
# Lifecycle 0.21.23 still uses Go 1.26.8; Liberica 11.10.0 drops Java 26 and has unpatched x/net.
# https://github.com/buildpacks/lifecycle/releases/tag/v0.21.23
# https://github.com/paketo-buildpacks/bellsoft-liberica/blob/v11.10.0/buildpack.toml
vulnerabilities:
  - id: CVE-2026-78667
    paths:
      - cnb/lifecycle/launcher
      - layers/paketo-buildpacks_bellsoft-liberica/helper/helper
      - layers/paketo-buildpacks_ca-certificates/helper/helper
      - layers/paketo-buildpacks_spring-boot/helper/helper
      - layers/sbom/launch/buildpacksio_lifecycle/launcher/sbom.spdx.json
    expired_at: 2026-10-29
    statement: >-
      Temporary exception for Paketo launch binaries: no HTTP file-serving path was identified that
      could process attacker-controlled Range headers. Application HTTP handling runs in Java.
  - id: CVE-2026-78669
    paths:
      - cnb/lifecycle/launcher
      - layers/paketo-buildpacks_bellsoft-liberica/helper/helper
      - layers/paketo-buildpacks_ca-certificates/helper/helper
      - layers/paketo-buildpacks_spring-boot/helper/helper
      - layers/sbom/launch/buildpacksio_lifecycle/launcher/sbom.spdx.json
    expired_at: 2026-10-29
    statement: >-
      Temporary exception for Paketo launch binaries: no HTTP/2 connection handling was identified
      on these launch paths. Application HTTP handling runs in Java.
  - id: CVE-2026-97031
    paths:
      - cnb/lifecycle/launcher
      - layers/paketo-buildpacks_bellsoft-liberica/helper/helper
      - layers/paketo-buildpacks_ca-certificates/helper/helper
      - layers/paketo-buildpacks_spring-boot/helper/helper
      - layers/sbom/launch/buildpacksio_lifecycle/launcher/sbom.spdx.json
    expired_at: 2026-10-29
    statement: >-
      Temporary exception for Paketo launch binaries: no TLS handshake with ECH processing was
      identified on these launch paths. The affected Go code is outside the Java application.
  - id: CVE-2026-111943
    paths:
      - layers/paketo-buildpacks_bellsoft-liberica/helper/helper
      - layers/paketo-buildpacks_ca-certificates/helper/helper
      - layers/paketo-buildpacks_spring-boot/helper/helper
    expired_at: 2026-10-29
    statement: >-
      Temporary risk acceptance for Paketo launch helpers built with unpatched Go. Published
      ca-certificates and spring-boot helpers still use Go 1.27.2. Certificate verification is
      linked in these helpers; the vulnerable path has not been ruled out. Remove once all listed
      helpers are built with Go 1.27.3 or another patched release.
