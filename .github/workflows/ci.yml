name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    permissions:
      contents: read
    uses: hu553in/common-things/.github/workflows/check-gradle.yml@main
    with:
      java_version: '26'
      gradle_jvmargs: -Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
      image_ref: invites-keycloak:check

  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: hu553in/common-things/.github/workflows/submit-gradle-dependencies.yml@main
    with:
      java_version: '26'

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: vars
        run: |
          echo "image=ghcr.io/$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: ./gradlew bootBuildImage --imageName="$IMAGE:$TAG"
      - id: push
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: hu553in/common-things/.github/actions/scan-docker@main
        with:
          image-ref: ${{ steps.vars.outputs.image }}@${{ steps.push.outputs.digest }}
      - if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  attest:
    needs: publish
    permissions:
      attestations: write
      id-token: write
      packages: write
    uses: hu553in/common-things/.github/workflows/attest-docker.yml@main
    with:
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}

  release:
    needs: [publish, attest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release-notes
        uses: hu553in/common-things/.github/actions/release-notes@main
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release-notes.outputs.changelog }}
